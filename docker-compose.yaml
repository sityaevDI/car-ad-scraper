services:
  frontend:
    build:
      context: ./frontend
      args:
        BASE_URL: "http://backend:8000"
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: "mongodb://mongodb:27017"
    depends_on:
      - mongodb

  # New Postgres-backed app/ (search API v1). Runs alongside the legacy `backend` service above,
  # not replacing it — `backend` is still what's actually deployed.
  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-car_aggregator}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - postgres
      - redis

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-car_aggregator}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  postgres_data:
