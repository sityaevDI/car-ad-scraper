services:
  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing URL for the `api` service (see below) — not the in-network `api:8001`
        # hostname, the browser resolves this outside the compose network.
        VITE_API_BASE_URL: "http://localhost:8001"
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-car_aggregator}"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-car_aggregator}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
